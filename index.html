<style>
:root{
  --bg:#f1f5f4; --sup:#ffffff; --tinta:#13201e; --mudo:#5b6b67; --linha:#dbe4e1; --linha2:#e9efed;
  --mata:#0f2e2b; --mata2:#16403b; --acento:#0f2e2b; --foco:#2f8f7f;
  --sombra:0 1px 2px rgba(15,46,43,.05),0 4px 14px rgba(15,46,43,.05);
  --aberto:#ab4a00; --aberto-bg:#fff1e5;
  --andamento:#0b68cb; --andamento-bg:#e9f3ff;
  --aguardando:#7a3db3; --aguardando-bg:#f5eefc;
  --resolvido:#18794e; --resolvido-bg:#e7f6ee;
  --encerrado:#60646c; --encerrado-bg:#eff0f1;
  --vencido:#ce2c31; --vencido-bg:#feebec;
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tinta);font:14px/1.45 var(--sans)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mudo{color:var(--mudo)}
.oculto{display:none!important}

/* lateral */
body{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
body > #faixa-demo{grid-column:1/-1}

%3Crect%20x%3D%22107%22%20y%3D%2299%22%20width%3D%2274%22%20height%3D%2238%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22187%22%20y%3D%2299%22%20width%3D%2220%22%20height%3D%2238%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22213%22%20y%3D%2299%22%20width%3D%2224%22%20height%3D%2238%22%20rx%3D%222%22/%3E%3Crect%20x%3D%223%22%20y%3D%22143%22%20width%3D%2234%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2243%22%20y%3D%22143%22%20width%3D%2246%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2295%22%20y%3D%22143%22%20width%3D%2228%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22129%22%20y%3D%22143%22%20width%3D%2274%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22209%22%20y%3D%22143%22%20width%3D%2220%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22235%22%20y%3D%22143%22%20width%3D%228%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%223%22%20y%3D%22179%22%20width%3D%2274%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22147%22%20y%3D%22179%22%20width%3D%2220%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22173%22%20y%3D%22179%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22241%22%20y%3D%22179%22%20width%3D%228%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%223%22%20y%3D%22209%22%20width%3D%2258%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2267%22%20y%3D%22209%22%20width%3D%2234%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22107%22%20y%3D%22209%22%20width%3D%2234%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22147%22%20y%3D%22209%22%20width%3D%2258%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22211%22%20y%3D%22209%22%20width%3D%2220%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22237%22%20y%3D%22209%22%20width%3D%228%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%223%22%20y%3D%22231%22%20width%3D%2220%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2229%22%20y%3D%22231%22%20width%3D%2234%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2269%22%20y%3D%22231%22%20width%3D%2274%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22149%22%20y%3D%22231%22%20width%3D%2234%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22189%22%20y%3D%22231%22%20width%3D%2248%22%20height%3D%2216%22%20rx%3D%222%22/%3E%3Crect%20x%3D%223%22%20y%3D%22253%22%20width%3D%2234%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2243%22%20y%3D%22253%22%20width%3D%2220%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2269%22%20y%3D%22253%22%20width%3D%2228%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22103%22%20y%3D%22253%22%20width%3D%2228%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22137%22%20y%3D%22253%22%20width%3D%2246%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22189%22%20y%3D%22253%22%20width%3D%2246%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22241%22%20y%3D%22253%22%20width%3D%228%22%20height%3D%2230%22%20rx%3D%222%22/%3E%3Crect%20x%3D%223%22%20y%3D%22289%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2237%22%20y%3D%22289%22%20width%3D%2258%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22153%22%20y%3D%22289%22%20width%3D%2274%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3Crect%20x%3D%22233%22%20y%3D%22289%22%20width%3D%228%22%20height%3D%2224%22%20rx%3D%222%22/%3E%3C/svg%3E") repeat;color:#e8f2ef;display:flex;flex-direction:column;padding:18px 12px;gap:18px;z-index:20;overflow-y:auto}
.lateral .marca{padding:4px 10px 0}
.lateral .marca b{display:block;font-family:var(--display);font-size:17px;font-weight:650;letter-spacing:-.01em;color:#fff;line-height:1.15}
.lateral .marca span{display:block;font-size:11.5px;color:#9fc2b9;margin-top:4px}
.lateral nav{display:flex;flex-direction:column;gap:2px;flex:1}
.lateral nav a{display:flex;align-items:center;gap:11px;text-decoration:none;padding:9px 10px;border-radius:9px;font-size:13.5px;color:#c9ddd8;transition:background .15s,color .15s}
.lateral nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.lateral nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.lateral nav a.ativo{background:#e8f2ef;color:var(--mata);font-weight:600}
.lateral nav a.ativo svg{opacity:1}
.lateral nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--vencido);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.lateral .usuario{border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.lateral .usuario #u-email{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lateral .usuario .perfil{font-family:var(--mono);font-size:10.5px;color:#9fc2b9;letter-spacing:.04em}
.lateral .usuario .bts{display:flex;gap:6px}
.lateral button{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#e8f2ef;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
.lateral button:hover{background:rgba(255,255,255,.13)}
body:has(#topo.oculto){display:block}

main{width:100%;max-width:1280px;margin:0 auto;padding:28px 32px 48px;grid-column:2}
h1{font-family:var(--display);font-size:26px;font-weight:650;letter-spacing:-.015em;margin:0 0 4px;line-height:1.15}
h2{font-family:var(--display);font-size:16px;font-weight:620;margin:0;letter-spacing:-.005em}
h3{font-size:14px;margin:0}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.cab p{margin:2px 0 0}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* botões */
.btn{border:1px solid var(--linha);background:var(--sup);border-radius:9px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s,box-shadow .15s}
.btn:hover{border-color:#aebdb8;box-shadow:0 1px 3px rgba(15,46,43,.08)}
.btn.prim{background:var(--mata);border-color:var(--mata);color:#fff}
.btn.prim:hover{background:var(--mata2)}
.btn.perigo{color:var(--vencido);border-color:#f3c2c4}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--tinta);text-decoration:underline;cursor:pointer;font-size:13px}

/* blocos */
.bloco{background:var(--sup);border:1px solid var(--linha);border-radius:14px;margin-bottom:18px;box-shadow:var(--sombra);overflow:hidden}
.bloco > .tit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--linha2);flex-wrap:wrap}
.bloco > .tit p{margin:2px 0 0;font-size:12px}
.bloco > .corpo{padding:16px 20px}
.bloco > .corpo.sem{padding:0}
.vazio{padding:20px;color:var(--mudo);font-size:13px}

/* tabelas */
.tab-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mudo);padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap;background:#f7faf9}
table.t td{padding:11px 12px;border-bottom:1px solid var(--linha2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.clica{cursor:pointer}
table.t tr.clica:hover td{background:#f3f8f6}
table.t td.num,table.t th.num{text-align:right}
table.t td.cod{font-family:var(--mono);font-size:12px;white-space:nowrap}
table.t td.cod a{text-decoration:none;border-bottom:1px solid #b8cbc5}
table.t td.acao{white-space:nowrap;text-align:right}
table.t td{min-width:0}
table.t td:has(> .sub){min-width:150px}
table.t .sub{font-size:12px;color:var(--mudo)}

/* situação */
.sit{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.sit::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.sit-pendente::before{display:none}
.sit-aberto{color:var(--aberto);background:var(--aberto-bg)}
.sit-andamento{color:var(--andamento);background:var(--andamento-bg)}
.sit-aguardando{color:var(--aguardando);background:var(--aguardando-bg)}
.sit-resolvido{color:var(--resolvido);background:var(--resolvido-bg)}
.sit-encerrado{color:var(--encerrado);background:var(--encerrado-bg)}
.sit-pendente{color:var(--mudo);background:transparent;border:1px dashed #c4c6ca}
.venc{color:var(--vencido);font-weight:600}
.ok{color:var(--resolvido)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;box-shadow:var(--sombra)}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.kpi .r{font-size:12.5px;color:var(--mudo);margin-top:4px}
.kpi.alerta .v{color:var(--vencido)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{border-color:#aebdb8;transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,46,43,.06),0 10px 24px rgba(15,46,43,.08)}
.card h3{font-family:var(--display);font-size:16px;font-weight:620}
.card .sig{font-family:var(--mono);font-size:12px;color:var(--mudo)}
.card .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card .nums div{background:#f3f7f6;border-radius:9px;padding:8px 10px}
.card .nums b{display:block;font-family:var(--mono);font-size:20px;font-weight:600}
.card .nums span{font-size:11px;color:var(--mudo)}
.card .nums .alerta b{color:var(--vencido)}
.card .datas{font-size:12px;color:var(--mudo);display:flex;justify-content:space-between;gap:8px}

/* filtros */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mudo);text-transform:uppercase;letter-spacing:.3px}
.filtros select,.filtros input[type=search]{min-width:150px}
.filtros .chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--tinta);padding-bottom:7px}

input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea{
  border:1px solid var(--linha);border-radius:9px;padding:8px 11px;background:#fff;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--foco);box-shadow:0 0 0 3px rgba(47,143,127,.18)}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
textarea{resize:vertical;min-height:64px}

/* ata */
.ata-cab{display:none}
.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px}
.ident div span{display:block;font-size:11px;color:var(--mudo);text-transform:uppercase;letter-spacing:.3px}
.ident div b{font-weight:500}
.pend-aviso{font-size:12px;color:var(--aberto);font-weight:600}
.assin{display:none}

/* ponto */
.linha-tempo{list-style:none;margin:0;padding:0}
.linha-tempo li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha2)}
.linha-tempo li:last-child{border-bottom:0}
.linha-tempo .dt{font-family:var(--mono);font-size:12px;color:var(--mudo)}
.linha-tempo .ev b{font-weight:600}
.linha-tempo .ev p{margin:3px 0 0}

/* modal */
.fundo{position:fixed;inset:0;background:rgba(10,30,28,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow-y:auto}
.modal{background:var(--sup);border-radius:18px;width:100%;max-width:620px;box-shadow:0 24px 60px rgba(10,30,28,.28);animation:surgir .18s ease-out}
@keyframes surgir{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal .mt{padding:16px 22px;border-bottom:1px solid var(--linha2);display:flex;justify-content:space-between;align-items:center}
.modal .mc{padding:18px 22px;display:grid;gap:12px}
.modal .mr{padding:14px 22px;border-top:1px solid var(--linha2);display:flex;justify-content:flex-end;gap:8px}
.modal .x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mudo);line-height:1}
.campo{display:flex;flex-direction:column;gap:4px}
.campo > span{font-size:12px;color:var(--mudo)}
.campo small{font-size:11px;color:var(--mudo)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.erro{background:var(--vencido-bg);color:var(--vencido);padding:8px 10px;border-radius:6px;font-size:13px}
.info{background:#f1f3f5;padding:8px 10px;border-radius:6px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--linha2);border-left:1px solid var(--linha2)}
.cal .dsem{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--mudo);padding:6px 8px;border-right:1px solid var(--linha2);border-bottom:1px solid var(--linha2);background:#fafbfb}
.cal .dia{min-height:96px;padding:4px 5px;border-right:1px solid var(--linha2);border-bottom:1px solid var(--linha2);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .dia:hover{background:#f8f9fa}
.cal .dia.fora{background:#fbfbfc;color:#b0b3b8}
.cal .dia.sel{box-shadow:inset 0 0 0 2px var(--tinta)}
.cal .dia .n{font-family:var(--mono);font-size:12px}
.cal .dia.hoje .n{background:var(--tinta);color:#fff;border-radius:999px;padding:0 6px;align-self:flex-start}
.ev{font-size:11px;line-height:1.25;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.ev-reuniao{background:#eff0f1;border-color:#8b8d98;color:#3a3d42}
.ev-agendada{background:var(--andamento-bg);border-color:var(--andamento);color:#0b4f99}
.ev-acao{background:var(--aguardando-bg);border-color:var(--aguardando);color:#5e2d8c}
.ev-prazo{background:var(--aberto-bg);border-color:var(--aberto);color:#7a3500}
.ev-vencido{background:var(--vencido-bg);border-color:var(--vencido);color:#a1161b}
.ev-feito{background:var(--resolvido-bg);border-color:var(--resolvido);color:#11603d}
.ev-revisao{background:#fff;border-color:#c4c6ca;color:var(--mudo);border-style:dashed}
.ev-cancelada{text-decoration:line-through;opacity:.6}
.ev .mais{color:var(--mudo)}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mudo);padding:10px 16px}
.legenda .ev{display:inline-block}
.lista-ev{list-style:none;margin:0;padding:0}
.lista-ev li{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:start;padding:9px 16px;border-bottom:1px solid var(--linha2)}
.lista-ev li:last-child{border-bottom:0}
.lista-ev .dt{font-family:var(--mono);font-size:12px;color:var(--mudo)}
@media (max-width:640px){ .cal .dia{min-height:58px} .cal .ev{font-size:0;height:5px;padding:0;border:0;background:currentColor!important;border-radius:3px} .lista-ev li{grid-template-columns:80px 1fr} .lista-ev li > :last-child{grid-column:1/3} }
.pres-grupo{border:1px solid var(--linha2);border-radius:8px;padding:8px 10px}
.pres-grupo .pg-tit{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;font-weight:600}
.pres-grupo .pg-tit span{display:flex;gap:6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.chip{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--linha);border-radius:7px;padding:6px 8px;cursor:pointer;user-select:none;font-size:13px;line-height:1.25;background:#fff}
.chip input{margin:2px 0 0;width:auto;accent-color:var(--tinta)}
.chip small{display:block;color:var(--mudo);font-size:11px;font-family:var(--mono)}
.chip:has(input:checked){border-color:var(--tinta);background:#f1f3f5;box-shadow:inset 0 0 0 1px var(--tinta)}
.pres-cont{font-family:var(--mono);font-size:12px;color:var(--mudo)}
.voz-caixa{position:relative;display:block}
.voz-caixa > input{padding-right:38px}
.voz-caixa > textarea{padding-right:40px}
.voz-bt{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:8px;border:1px solid var(--linha);background:#f3f7f6;color:var(--mudo);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.voz-caixa > input + .voz-bt{top:50%;transform:translateY(-50%)}
.voz-bt svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.voz-bt:hover{color:var(--mata);border-color:#aebdb8}
.voz-caixa.ouvindo > textarea,.voz-caixa.ouvindo > input{border-color:var(--vencido);box-shadow:0 0 0 3px rgba(206,44,49,.15)}
.voz-caixa.ouvindo .voz-bt{background:var(--vencido);border-color:var(--vencido);color:#fff;animation:pulsar 1.2s ease-in-out infinite}
@keyframes pulsar{0%,100%{box-shadow:0 0 0 0 rgba(206,44,49,.45)}50%{box-shadow:0 0 0 6px rgba(206,44,49,0)}}
.part-linha{display:grid;grid-template-columns:2fr 1.4fr 1fr auto 28px;gap:6px;align-items:center}
.part-linha .cad{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mudo);white-space:nowrap;cursor:pointer}
.part-linha .cad input{width:auto;margin:0}
.part-linha button{border:0;background:none;color:var(--mudo);cursor:pointer;font-size:16px}

let perfil = null;

function traduzAuth(j){
  const m = (j && (j.msg || j.error_description || j.message || j.error)) || '';
  if(/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Abra o link de confirmação enviado para o seu e-mail.';
  if(/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use "Entrar" ou "Esqueci a senha".';
  if(/password.*(at least|characters)/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  return m;
}
async function authReq(caminho, corpo, metodo='POST'){
  const h = {apikey:SB_KEY, 'Content-Type':'application/json'};
  if(sessao && sessao.access_token && (caminho==='user' || caminho==='logout')) h.Authorization = 'Bearer '+sessao.access_token;
  const r = await fetch(SB_URL+'/auth/v1/'+caminho, {method:metodo, headers:h, body: metodo==='GET'?undefined:JSON.stringify(corpo||{})});
  const t = await r.text(); let j=null; try{ j = t?JSON.parse(t):null; }catch(e){}
  if(!r.ok) throw new Error(traduzAuth(j) || ('Erro '+r.status));
  return j;
}
function guardarSessao(j){
  sessao = {
    access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || Math.floor(Date.now()/1000) + Number(j.expires_in||3600),
    email: (j.user && j.user.email) || (sessao && sessao.email) || ''
  };
  loja.set(SESSAO_CHAVE, sessao);
}
async function renovar(){
  if(!sessao || !sessao.refresh_token) throw new Error('SESSAO');
  try { guardarSessao(await authReq('token?grant_type=refresh_token', {refresh_token: sessao.refresh_token})); }
  catch(e){ sair(true); throw new Error('SESSAO'); }
}
async function tokenValido(){
  if(!sessao) throw new Error('SESSAO');
  if((sessao.expires_at||0) - 60 < Date.now()/1000) await renovar();
  return sessao.access_token;
}
function redirecionar(){ return /^https?:/.test(location.protocol) ? location.href.split('#')[0] : null; }
function sair(silencioso){
  if(sessao && !silencioso) authReq('logout', {}).catch(()=>{});
  sessao = null; perfil = null; loja.del(SESSAO_CHAVE);
  $('#topo').classList.add('oculto');
  telaLogin(silencioso ? 'Sua sessão expirou. Entre novamente.' : '');
}

/* ================= API REST ================= */
function traduzApi(j, status){
  const code = j && j.code, msg = (j && (j.message || j.msg)) || '';
  if(code==='23505'){
    if(/matric_reunioes_ubs_id_data/.test(msg)) return 'Já existe reunião desta UBS nesta data.';
    if(/matric_ubs_sigla/.test(msg)) return 'Já existe UBS com esta sigla.';
    if(/matric_acesso_pkey/.test(msg)) return 'Este e-mail já está na lista de acesso.';
    return 'Registro duplicado.';
  }
  if(code==='23503') return 'Não é possível excluir: há registros ligados a este item (pontos, atualizações ou encaminhamentos).';
  if(code==='23514' && /sigla/.test(msg)) return 'Sigla inválida: use de 2 a 10 letras maiúsculas ou números, sem espaço.';
  if(code==='42501' || status===403) return 'Sem permissão para esta ação. Só quem tem acesso de edição pode alterar.';
  return msg || ('Erro '+status);
}
async function api(metodo, caminho, corpo, prefer, extraHeaders){
  let renovou = false;
  for(;;){
    const h = {apikey:SB_KEY, Authorization:'Bearer '+await tokenValido(), 'Content-Type':'application/json', ...(extraHeaders||{})};
    if(prefer) h.Prefer = prefer;
    const r = await fetch(SB_URL+'/rest/v1/'+caminho, {method:metodo, headers:h, body: corpo===undefined?undefined:JSON.stringify(corpo)});
    if(r.status===401 && !renovou){ renovou = true; await renovar(); continue; }
    const t = await r.text(); let j=null; try{ j = t?JSON.parse(t):null; }catch(e){}
    if(!r.ok) throw new Error(traduzApi(j, r.status));
    return j;
  }
}
async function todos(tabela, query){
  const lote = 1000; let ini = 0, saida = [];
  for(;;){
    const parte = await api('GET', `${tabela}?${query}`, undefined, null, {'Range-Unit':'items', Range:`${ini}-${ini+lote-1}`});
    saida = saida.concat(parte||[]);
    if(!parte || parte.length < lote) return saida;
    ini += lote;
  }
}
const inserir = (t,linha) => api('POST', t, linha, 'return=representation');
async function alterar(t, id, linha, col='id'){
  const r = await api('PATCH', `${t}?${col}=eq.${encodeURIComponent(id)}`, linha, 'return=representation');
  if(!r || !r.length) throw new Error('Sem permissão para esta ação. Só quem tem acesso de edição pode alterar.');
  return r;
}
async function excluir(t, id, col='id'){
  const r = await api('DELETE', `${t}?${col}=eq.${encodeURIComponent(id)}`, undefined, 'return=representation');
  if(!r || !r.length) throw new Error('Sem permissão para excluir.');
  return r;
}
const gravarOuAtualizar = (t, linha, conflito) => api('POST', `${t}?on_conflict=${conflito}`, linha, 'resolution=merge-duplicates,return=representation');

const D = {ubs:[], reunioes:[], pontos:[], atual:[], enc:[], acesso:[], agentes:[], pact:[], agenda:[]};
const IX = {agente:new Map(), ubs:new Map(), reun:new Map(), ponto:new Map(), atualPonto:new Map(), atualChave:new Map(), encPonto:new Map()};
const F = {ubs:'', pSit:'abertos', pTipo:'', pBusca:'', eConc:false, eBusca:'', aUbs:'', aFun:'', aIn:false, gMes:'', gDia:'', gUbs:'', gTipos:{reuniao:true, acao:true, prazo:true, revisao:true}, kUbs:'', kSit:'ativas', kBusca:''};

async function carregar(){
  const [u,r,p,a,e,g,k,ag] = await Promise.all([
    todos('matric_ubs','select=*&order=sigla'),
    todos('matric_reunioes','select=*&order=data.desc'),
    todos('matric_pontos','select=*&order=codigo'),
    todos('matric_atualizacoes','select=*'),
    todos('matric_encaminhamentos','select=*&order=prazo.asc.nullslast'),
    todos('matric_agentes','select=*&order=nome'),
    todos('matric_pactuacoes','select=*&order=data.desc'),
    todos('matric_agenda','select=*&order=data')
  ]);
  Object.assign(D, {ubs:u, reunioes:r, pontos:p, atual:a, enc:e, agentes:g, pact:k, agenda:ag});
  if(perfil && perfil.admin) D.acesso = await todos('matric_acesso','select=*&order=nome');
  indexar();
}
function indexar(){
  D.reunioes.sort((a,b)=>b.data.localeCompare(a.data));
  D.pontos.sort((a,b)=>a.codigo.localeCompare(b.codigo));
  IX.ubs = new Map(D.ubs.map(x=>[x.id,x]));
  IX.agente = new Map(D.agentes.map(x=>[x.id,x]));
  IX.reun = new Map(D.reunioes.map(x=>[x.id,x]));
  IX.ponto = new Map(D.pontos.map(x=>[x.id,x]));
  IX.atualPonto = new Map(); IX.atualChave = new Map(); IX.encPonto = new Map();
  for(const a of D.atual){
    if(!IX.atualPonto.has(a.ponto_id)) IX.atualPonto.set(a.ponto_id, []);
    IX.atualPonto.get(a.ponto_id).push(a);
    IX.atualChave.set(a.ponto_id+'|'+a.reuniao_id, a);
  }
  for(const e of D.enc){
    if(!IX.encPonto.has(e.ponto_id)) IX.encPonto.set(e.ponto_id, []);
    IX.encPonto.get(e.ponto_id).push(e);
  }
}
const ubsNome = id => { const u = IX.ubs.get(id); return u ? u.nome : '—'; };
const ubsSigla = id => { const u = IX.ubs.get(id); return u ? u.sigla : '—'; };
const dataReun = id => { const r = IX.reun.get(id); return r ? r.data : null; };
const atualDe = (pontoId, reunId) => IX.atualChave.get(pontoId+'|'+reunId);
function situacaoAntes(p, data){
  let melhor = null;
  for(const a of IX.atualPonto.get(p.id)||[]){
    const d = dataReun(a.reuniao_id);
    if(d && d < data && (!melhor || d > melhor.d)) melhor = {a, d};
  }
  return melhor ? melhor.a.situacao : 'Aberto';
}
function situacaoNa(p, R){ // situação do ponto ao fim da reunião R
  const a = atualDe(p.id, R.id);
  return a ? a.situacao : (p.reuniao_origem===R.id ? 'Aberto' : situacaoAntes(p, R.data));
}
function parteA(R){
  return D.pontos.filter(p => {
    if(p.ubs_id !== R.ubs_id) return false;
    const dOrig = dataReun(p.reuniao_origem);
    if(!dOrig || dOrig >= R.data) return false;
    return !!atualDe(p.id, R.id) || !FECHADAS.has(situacaoAntes(p, R.data));
  }).sort((a,b)=>a.codigo.localeCompare(b.codigo));
}
const parteB = R => D.pontos.filter(p => p.reuniao_origem === R.id).sort((a,b)=>a.codigo.localeCompare(b.codigo));
const parteC = R => D.enc.filter(e => e.reuniao_id === R.id).sort((a,b)=>(IX.ponto.get(a.ponto_id)?.codigo||'').localeCompare(IX.ponto.get(b.ponto_id)?.codigo||'') || (a.criado_em||'').localeCompare(b.criado_em||''));
function encAnteriores(p, data){
  return (IX.encPonto.get(p.id)||[]).filter(e => { const d = dataReun(e.reuniao_id); return d && d < data; })
    .sort((a,b)=>(dataReun(a.reuniao_id)||'').localeCompare(dataReun(b.reuniao_id)||''));
}
const vencido = e => !e.concluido && e.prazo && e.prazo < hoje();
const abertos = () => D.pontos.filter(p => !FECHADAS.has(p.situacao));

  $('#app').innerHTML = `
  <div class="login">
    <h1>Atas de Matriciamento ACS × ACV</h1>
    <p class="mudo" style="margin:4px 0 0">Vigilância em Saúde · Controle de Vetores · Paulínia</p>
    <form id="f-login">
      <h3>${titulos[modo]}</h3>
      ${msg?`<div class="${/enviad|criada|confirm/i.test(msg)&&!/não/i.test(msg)?'info':'erro'}">${esc(msg)}</div>`:''}
      <label class="campo"><span>E-mail</span><input type="email" name="email" required autocomplete="email" value="${esc(loja.get('matric_ultimo_email')||'')}"></label>
      ${modo!=='esqueci'?`<label class="campo"><span>Senha</span><input type="password" name="senha" required minlength="6" autocomplete="${modo==='criar'?'new-password':'current-password'}"></label>`:''}
      ${modo==='criar'?`<label class="campo"><span>Repita a senha</span><input type="password" name="senha2" required minlength="6" autocomplete="new-password"></label>`:''}
      <button class="btn prim" type="submit">${modo==='entrar'?'Entrar':modo==='criar'?'Criar acesso':'Enviar link de recuperação'}</button>
      ${modo==='entrar'?'<p class="mudo" style="margin:0;font-size:12px">Quem já usa o painel de dengue entra com o mesmo e-mail e senha.</p>':''}
    </form>
    <div class="alt">
      ${modo!=='entrar'?'<button class="lnk" data-m="entrar">Voltar para entrar</button>':'<button class="lnk" data-m="criar">Primeiro acesso</button>'}
      ${modo==='entrar'?'<button class="lnk" data-m="esqueci">Esqueci a senha</button>':''}
    </div>
  </div>`;
  document.querySelectorAll('.alt [data-m]').forEach(b => b.onclick = () => telaLogin('', b.dataset.m));
  $('#f-login').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, email = f.email.value.trim().toLowerCase(), bt = f.querySelector('button[type=submit]');
    loja.set('matric_ultimo_email', email);
    bt.disabled = true;
    try{
      if(modo==='entrar'){
        guardarSessao(await authReq('token?grant_type=password', {email, password:f.senha.value}));
        await iniciar();
      } else if(modo==='criar'){
        if(f.senha.value !== f.senha2.value) throw new Error('As senhas não conferem.');
        const red = redirecionar();
        const j = await authReq('signup'+(red?'?redirect_to='+encodeURIComponent(red):''), {email, password:f.senha.value});
        if(j && j.access_token){ guardarSessao(j); await iniciar(); }
        else telaLogin('Conta criada. Abra o link de confirmação enviado para '+email+' e depois volte aqui para entrar.', 'entrar');
      } else {
        const red = redirecionar();
        await authReq('recover'+(red?'?redirect_to='+encodeURIComponent(red):''), {email});
        telaLogin('Se o e-mail tiver conta, um link de recuperação foi enviado para '+email+'.', 'entrar');
      }
    }catch(e){ telaLogin(e.message, modo); }
  };
}

  modal('Definir nova senha', `

    <label class="campo"><span>Repita a nova senha</span><input type="password" name="s2" minlength="6" required></label>`,

      if(f.s1.value !== f.s2.value) throw new Error('As senhas não conferem.');

      await authReq('user', {password:f.s1.value}, 'PUT');
      aviso('Senha alterada.');

async function lerRetornoEmail(){
  if(!/access_token=/.test(location.hash)) return null;
  const q = new URLSearchParams(location.hash.slice(1));
  guardarSessao({access_token:q.get('access_token'), refresh_token:q.get('refresh_token'), expires_in:q.get('expires_in')});
  try{ const u = await authReq('user', null, 'GET'); sessao.email = u.email; loja.set(SESSAO_CHAVE, sessao); }catch(e){}
  history.replaceState(null, '', location.pathname + location.search + '#/');
  return q.get('type');
}
async function iniciar(){
  const tipo = await lerRetornoEmail();
  if(!sessao) return telaLogin('');
  $('#app').innerHTML = '<div class="carregando">Carregando dados…</div>';
  try{
    perfil = await api('POST', 'rpc/matric_perfil', {});
    if(!perfil || !perfil.le){
      $('#topo').classList.add('oculto');
      $('#app').innerHTML = `<div class="login"><h1>Acesso ainda não liberado</h1>
        <p>Você entrou como <b>${esc(sessao.email)}</b>, mas este e-mail ainda não está na lista de acesso das atas de matriciamento.</p>
        <p class="mudo">Peça ao administrador da Divisão de Controle de Vetores para incluir seu e-mail. Depois, toque em "Tentar de novo".</p>
        <div class="acoes"><button class="btn prim" id="b-tentar">Tentar de novo</button><button class="btn" id="b-sair2">Sair</button></div></div>`;
      $('#b-tentar').onclick = iniciar; $('#b-sair2').onclick = () => sair();
      return;
    }
    await carregar();
  }catch(e){
    if(e.message==='SESSAO') return;
    $('#app').innerHTML = `<div class="login"><h1>Não foi possível carregar</h1><div class="erro">${esc(e.message)}</div>
      <p class="mudo">Verifique a internet. Se o problema continuar, o projeto do Supabase pode estar pausado por inatividade e precisa ser reativado pelo administrador.</p>
      <div class="acoes"><button class="btn prim" id="b-tentar">Tentar de novo</button><button class="btn" id="b-sair2">Sair</button></div></div>`;
    $('#b-tentar').onclick = iniciar; $('#b-sair2').onclick = () => sair();
    return;
  }
  $('#topo').classList.remove('oculto');
  $('#u-email').textContent = perfil.nome || sessao.email;
  $('#u-perfil').textContent = perfil.admin ? 'ADMIN' : perfil.edita ? 'EDIÇÃO' : 'CONSULTA' + (D.ubs.length ? ' · ' + D.ubs.map(u=>u.sigla).join(', ') : '');
  if(tipo==='recovery') trocarSenha();
  render();
}
async function recarregar(msg){
  try{ await carregar(); render(); if(msg) aviso(msg); }
  catch(e){ if(e.message!=='SESSAO') aviso(e.message, true); }
}

/* ================= Modal ================= */
function modal(titulo, corpo, aoSalvar, {rotulo='Salvar', perigo=false, largura} = {}){
  const fundo = document.createElement('div'); fundo.className = 'fundo';
  fundo.innerHTML = `<form class="modal" ${largura?`style="max-width:${largura}px"`:''} novalidate>
    <div class="mt"><h2>${esc(titulo)}</h2><button type="button" class="x" aria-label="Fechar">×</button></div>
    <div class="mc"><div class="erro oculto" data-erro></div>${corpo}</div>
    <div class="mr"><button type="button" class="btn" data-cancelar>Cancelar</button>
    ${aoSalvar?`<button type="submit" class="btn ${perigo?'perigo':'prim'}">${esc(rotulo)}</button>`:''}</div></form>`;
  document.body.appendChild(fundo);
  const form = fundo.querySelector('form');
  const fechar = () => { pararDitado(); fundo.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = ev => { if(ev.key==='Escape') fechar(); };
  document.addEventListener('keydown', esc_);
  fundo.querySelector('.x').onclick = fechar;
  fundo.querySelector('[data-cancelar]').onclick = fechar;
  fundo.addEventListener('mousedown', ev => { if(ev.target===fundo) fechar(); });
  form.onsubmit = async ev => {
    ev.preventDefault();
    const bt = form.querySelector('button[type=submit]'), er = form.querySelector('[data-erro]');
    for(const el of form.querySelectorAll('[required]')){
      if(!String(el.value||'').trim()){ er.textContent = 'Preencha os campos obrigatórios.'; er.classList.remove('oculto'); el.focus(); return; }
    }
    pararDitado();
    bt.disabled = true; er.classList.add('oculto');
    try{ const r = await aoSalvar(form); if(r!==false) fechar(); }
    catch(e){ er.textContent = e.message==='SESSAO'?'Sessão expirada.':e.message; er.classList.remove('oculto'); }
    finally{ bt.disabled = false; }
  };
  ligarDitado(form);
  const primeiro = form.querySelector('.mc input:not([type=hidden]),.mc select,.mc textarea');
  if(primeiro) primeiro.focus();
  return form;
}

function avisoVoz(msg){
  modal('Ditado por voz', `<p style="margin:0">${msg}</p><div class="info">${DICA_VOZ}</div>`, null);
}
function ligarDitado(raiz){
  raiz.querySelectorAll(CAMPOS_VOZ).forEach(campo => {
    if(campo.disabled || campo.dataset.voz) return;
    campo.dataset.voz = '1';
    const caixa = document.createElement('div'); caixa.className = 'voz-caixa';
    campo.parentNode.insertBefore(caixa, campo); caixa.appendChild(campo);
    const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'voz-bt'; bt.title = 'Ditar por voz';
    bt.setAttribute('aria-label', 'Ditar por voz');
    bt.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
    caixa.appendChild(bt);
    bt.onclick = () => {
      if(!Reconhecedor) return avisoVoz('Este navegador não tem reconhecimento de voz. Use o Chrome ou o Edge.');
      if(!window.isSecureContext || location.protocol === 'file:')
        return avisoVoz('O ditado do sistema só funciona quando ele é aberto por um endereço da internet (https). Aberto como arquivo no computador ou no celular, o navegador bloqueia o microfone sem perguntar.');
      if(ditadoAtivo && ditadoAtivo.campo === campo){ pararDitado(); return; }
      pararDitado();
      const rec = new Reconhecedor();
      rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
      const base = campo.value.replace(/\s+$/,'');
      let final = '';
      const escrever = (provisorio) => {
        let t = ajustarFala((final + ' ' + provisorio).replace(/\s+/g,' ').trim());
        if(t && (!base || /[.!?\n]$/.test(base))) t = t.charAt(0).toUpperCase() + t.slice(1);
        campo.value = base + (base && t && !/^[,.:?]/.test(t) ? (campo.tagName==='TEXTAREA' && /[.!?]$/.test(base) ? ' ' : ' ') : '') + t;
        campo.dispatchEvent(new Event('input', {bubbles:true}));
      };
      rec.onresult = ev => {
        let prov = '';
        for(let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if(r.isFinal) final += ' ' + r[0].transcript; else prov += r[0].transcript;
        }
        escrever(prov);
      };
      rec.onerror = ev => {
        const m = {'not-allowed':'Permita o uso do microfone no navegador para ditar.', 'service-not-allowed':'Permita o uso do microfone no navegador para ditar.',
          'network':'O ditado precisa de internet.', 'no-speech':'Nenhuma fala detectada. Toque no microfone e fale de novo.', 'audio-capture':'Nenhum microfone encontrado.'}[ev.error];
        if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed') return avisoVoz('O navegador bloqueou o microfone. Clique no cadeado ao lado do endereço, libere o microfone e tente de novo.');
        if(ev.error !== 'aborted') aviso(m || ('O ditado falhou (' + ev.error + ').'), true);
      };
      rec.onend = () => { escrever(''); caixa.classList.remove('ouvindo'); if(ditadoAtivo && ditadoAtivo.rec === rec) ditadoAtivo = null; };
      ditadoAtivo = {rec, campo};
      caixa.classList.add('ouvindo'); campo.focus();
      try{ rec.start(); }catch(e){ caixa.classList.remove('ouvindo'); ditadoAtivo = null; aviso('Não foi possível iniciar o ditado.', true); }
    };
  });
}

  const rs = D.reunioes.filter(r => r.ubs_id===ubsId && r.data<=hoje()).sort((a,b)=>a.data.localeCompare(b.data)).slice(-6);

    <div class="barras">${val.map((v,i)=>`<i class="${i===val.length-1?'ult':''}" style="height:${Math.max(6, v/max*100)}%" title="${fmt(rs[i].data)}: ${v} em aberto"></i>`).join('')}</div>

function ligarPresenca(form, r){
  const marcados = new Set((r ? r.participantes||[] : []).filter(p=>p.agente_id).map(p=>Number(p.agente_id)));
  const box = form.querySelector('#presenca'), cont = form.querySelector('#pres-cont');

  const grupo = (titulo, lista, mostrarUbs) => !lista.length ? '' : `<div class="pres-grupo"><div class="pg-tit">${esc(titulo)} <span class="mudo mono">${lista.length}</span>
      <span><button type="button" class="btn mini" data-todos>Todos</button><button type="button" class="btn mini" data-nenhum>Nenhum</button></span></div>
      <div class="chips">${lista.map(g => `<label class="chip"><input type="checkbox" data-ag="${g.id}" ${marcados.has(g.id)?'checked':''}>
        <span>${esc(g.nome)}<small>${esc([g.funcao!=='ACS'&&g.funcao!=='ACV'?g.funcao:'', mostrarUbs?siglasAgente(g):'', areaAgente(g)].filter(Boolean).join(' · ') || g.funcao)}</small></span></label>`).join('')}</div></div>`;
  const desenhar = () => {
    const ubs = Number(form.ubs_id.value) || null;

    const acs = ativos.filter(g => g.funcao==='ACS' && ubs && g.ubs_id===ubs).sort(ordemAgente);
    const acv = ativos.filter(g => g.funcao==='ACV' && ubs && atende(g, ubs)).sort(ordemAgente);
    const outros = ativos.filter(g => g.funcao!=='ACS' && g.funcao!=='ACV' && (!ubsDoAgente(g).length || (ubs && atende(g, ubs)))).sort(ordemAgente);
    const acvOutras = ativos.filter(g => g.funcao==='ACV' && !acv.includes(g)).sort(ordemAgente);
    // marcados de outra UBS continuam visíveis para não sumirem ao trocar a UBS
    const fora = ativos.filter(g => marcados.has(g.id) && g.funcao!=='ACV' && !acs.includes(g) && !outros.includes(g));
    const ubsNomeSel = ubs ? ubsNome(ubs) : '';
    box.innerHTML = (!ubs ? '<div class="info">Escolha a UBS para ver os ACS dela.</div>' : (acs.length ? '' : '<div class="info">Nenhum ACS cadastrado para esta UBS.</div>'))
      + grupo('ACS — '+ubsNomeSel, acs) + grupo('ACV — '+(ubsNomeSel||'escolha a UBS'), acv, true) + grupo('UBS e supervisão', outros, true) + grupo('Marcados de outras UBS', fora, true)
      + (acvOutras.length ? `<details class="pres-grupo"><summary style="cursor:pointer;font-size:12px;font-weight:600">ACV de outras UBS (${acvOutras.length})</summary><div style="margin-top:8px">${grupo('', acvOutras, true).replace('class="pres-grupo"','style="border:0;padding:0"')}</div></details>` : '')
      + (D.agentes.length ? '' : '<div class="info">Nenhum agente cadastrado ainda. O administrador cadastra em Administração → Agentes.</div>');
    box.querySelectorAll('input[data-ag]').forEach(ch => ch.onchange = () => { const id = Number(ch.dataset.ag); ch.checked ? marcados.add(id) : marcados.delete(id); contar(); });
    box.querySelectorAll('.pres-grupo').forEach(gr => {
      gr.querySelector('[data-todos]').onclick = () => { gr.querySelectorAll('input[data-ag]').forEach(ch => { ch.checked = true; marcados.add(Number(ch.dataset.ag)); }); contar(); };
      gr.querySelector('[data-nenhum]').onclick = () => { gr.querySelectorAll('input[data-ag]').forEach(ch => { ch.checked = false; marcados.delete(Number(ch.dataset.ag)); }); contar(); };
    });
    contar();
  };
  form._marcados = marcados; form._desenharPresenca = desenhar;
  desenhar();
  // outros participantes (texto livre)
  const pbox = form.querySelector('#parts');

}
async function cadastrarOutros(form, ubsId){
  const linhas = [...form.querySelectorAll('#parts .part-linha')].filter(l => l.querySelector('[data-p=salvar]').checked);

    const nome = l.querySelector('[data-p=nome]').value.trim(), funcao = l.querySelector('[data-p=funcao]').value, area = l.querySelector('[data-p=area]').value.trim();
    if(!nome || !funcao) throw new Error('Para cadastrar, preencha nome e função de cada pessoa marcada.');

    D.agentes.push(g); IX.agente.set(g.id, g); form._marcados.add(g.id); l.remove();
  }
  if(linhas.length) form._desenharPresenca();
}
function lerParticipantes(form){

    .map(g => ({agente_id:g.id, nome:g.nome, funcao:g.funcao, area:g.funcao==='ACS' ? areaAgente(g) : [siglasAgente(g), areaAgente(g)].filter(Boolean).join(' · ')}));

  }).join('');
  const linhasB = B.map(p => `<tr>
      <td class="cod"><a href="#/ponto/${p.id}">${esc(p.codigo)}</a></td>
      <td>${esc(p.endereco||'—')}<div class="sub mono">${[p.quarteirao?'Q. '+esc(p.quarteirao):'', esc(p.microarea||'')].filter(Boolean).join(' · ')}</div></td>
      <td>${esc(p.tipo||'—')}</td>
      <td>${esc(p.descricao)}</td>
      <td>${esc(p.levantado_por||'—')}</td>
      ${ed?`<td class="acao"><button class="btn mini" data-epto="${p.id}">Editar</button></td>`:''}</tr>`).join('');
  const linhasC = C.map(e => { const p = IX.ponto.get(e.ponto_id); return `<tr>
      <td class="cod">${p?`<a href="#/ponto/${p.id}">${esc(p.codigo)}</a>`:'—'}</td>
      <td>${esc(e.acao)}</td>
      <td>${esc(e.responsavel||'—')}</td>
      <td class="mono ${vencido(e)?'venc':''}">${fmt(e.prazo)}</td>
      <td>${e.concluido?'<span class="ok">Sim</span>':vencido(e)?'<span class="venc">Vencido</span>':'Não'}</td>
      ${ed?`<td class="acao"><button class="btn mini" data-conc="${e.id}">${e.concluido?'Reabrir':'Concluir'}</button> <button class="btn mini" data-eenc="${e.id}">Editar</button></td>`:''}</tr>`; }).join('');
  const resolvidos = A.filter(p => { const a = atualDe(p.id,R.id); return a && FECHADAS.has(a.situacao); }).length;
  const emAberto = A.concat(B).filter(p => !FECHADAS.has(situacaoNa(p, R))).length;
  const thAcao = ed ? '<th class="acao"></th>' : '';

  $('#app').innerHTML = `
    <div class="ata-cab"><b>Ata da Reunião de Matriciamento ACS × ACV</b>
      <span>Prefeitura Municipal de Paulínia · Departamento de Vigilância em Saúde · Divisão de Controle de Vetores</span></div>
    <div class="cab"><div>
      <a href="#/reunioes" class="lnk nao-imprime">← Reuniões</a>
      <h1>${esc(ubsSigla(R.ubs_id))} — ${esc(ubsNome(R.ubs_id))}</h1>
      <p class="mudo">Reunião ${R.numero?'nº '+R.numero+' · ':''}<span class="mono">${fmt(R.data)}</span></p></div>
      <div class="acoes nao-imprime">
        <button class="btn" id="b-imp">Imprimir / PDF</button>
        ${ed?'<button class="btn" id="b-edr">Editar identificação</button><button class="btn perigo" id="b-exr">Excluir</button>':''}

      <div class="ident">
        <div><span>UBS</span><b>${esc(ubsNome(R.ubs_id))}</b></div>
        <div><span>Data</span><b class="mono">${fmt(R.data)}</b></div>
        <div><span>Reunião nº</span><b class="mono">${R.numero??'—'}</b></div>
        <div><span>Local</span><b>${esc(R.local||'—')}</b></div>
        <div><span>Horário</span><b class="mono">${R.hora_inicio||R.hora_fim?esc(R.hora_inicio||'?')+' – '+esc(R.hora_fim||'?'):'—'}</b></div>
        <div><span>Redigida por</span><b>${esc(R.redator||'—')}</b></div>
      </div>
      ${parts.length?`<div class="tab-wrap" style="margin-top:14px"><table class="t"><thead><tr><th>Participante</th><th>Função</th><th>Microárea / área</th></tr></thead>
        <tbody>${parts.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.funcao)}</td><td>${esc(p.area)}</td></tr>`).join('')}</tbody></table></div>`:

      ${pend?`<span class="pend-aviso">${pend} ponto(s) ainda sem atualização</span>`:''}</div>
      <div class="corpo sem">${A.length?`<div class="tab-wrap"><table class="t"><thead><tr><th>Código</th><th>Endereço · quarteirão · microárea</th><th>Ponto</th><th>Encaminhamento anterior</th><th>O que foi feito</th><th>Situação</th>${thAcao}</tr></thead>
        <tbody>${linhasA}</tbody></table></div>`:'<div class="vazio">Nenhum ponto em aberto de reuniões anteriores.</div>'}</div></section>

        <tbody>${linhasB}</tbody></table></div>`:'<div class="vazio">Nenhum ponto novo nesta reunião.</div>'}</div></section>

    <section class="bloco"><div class="tit"><div><h2>Parte C — Encaminhamentos</h2>

      <div class="corpo sem">${C.length?`<div class="tab-wrap"><table class="t"><thead><tr><th>Ponto</th><th>Encaminhamento</th><th>Responsável</th><th>Prazo</th><th>Concluído</th>${thAcao}</tr></thead>
        <tbody>${linhasC}</tbody></table></div>`:'<div class="vazio">Nenhum encaminhamento registrado.</div>'}</div></section>

    <section class="bloco"><div class="tit"><div><h2>Parte D — Pactuações</h2>
      <p class="mudo">Combinados firmados nesta reunião. ${(() => { const n = D.pact.filter(k=>k.situacao!=='Encerrada' && (!k.ubs_id || k.ubs_id===R.ubs_id) && k.reuniao_id!==R.id).length; return n ? `<a href="#/pactuacoes" class="nao-imprime" data-pubs="${R.ubs_id}">Ver as ${n} pactuações vigentes desta UBS</a>` : ''; })()}</p></div>
      ${ed?'<button class="btn prim nao-imprime" id="b-npact">+ Pactuação</button>':''}</div>
      <div class="corpo sem">${tabelaPact(D.pact.filter(k=>k.reuniao_id===R.id), ed, false)}</div></section>

    <section class="bloco"><div class="tit"><h2>Fechamento</h2>${ed?'<button class="btn nao-imprime" id="b-fech">Editar fechamento</button>':''}</div><div class="corpo">
      <div class="ident">
        <div><span>Pontos retomados</span><b class="mono">${A.length}</b></div>
        <div><span>Resolvidos ou encerrados</span><b class="mono">${resolvidos}</b></div>
        <div><span>Novos pontos</span><b class="mono">${B.length}</b></div>
        <div><span>Em aberto para a próxima</span><b class="mono">${emAberto}</b></div>
        <div><span>Próxima reunião</span><b class="mono">${fmt(R.proxima_data)}</b></div>
        <div><span>Local da próxima</span><b>${esc(R.proxima_local||'—')}</b></div>
      </div>
      <div style="margin-top:12px"><span class="mudo" style="font-size:11px;text-transform:uppercase;letter-spacing:.3px">Observações gerais</span>
        <p style="margin:4px 0 0;white-space:pre-wrap">${esc(R.observacoes||'—')}</p></div>
      <div class="assin">${(parts.length?parts:[{},{},{},{}]).map(p=>`<div>${esc(p.nome||'')}${p.funcao?' · '+esc(p.funcao):''}</div>`).join('')}</div>
      <p class="mudo" style="font-size:11px;margin:14px 0 0">Registrada por ${esc(R.criado_por||'—')} · última alteração ${esc(R.atualizado_por||'—')}</p>

  $('#b-imp').onclick = () => window.print();

  $('#b-npact').onclick = () => formPact(null, R);
  $('#b-edr').onclick = () => editarReuniao(R);
  $('#b-exr').onclick = () => confirmar('Excluir reunião',
    `Excluir a reunião de <b>${fmt(R.data)}</b> da ${esc(ubsSigla(R.ubs_id))}? As atualizações e encaminhamentos registrados nela também serão apagados. Se a reunião tiver pontos novos (Parte B), exclua os pontos antes.`,
    async () => { await excluir('matric_reunioes', R.id); await carregar(); location.hash = '#/reunioes'; aviso('Reunião excluída.'); });
  $('#b-npto').onclick = () => formPonto(R, null);
  $('#b-nenc').onclick = () => formEnc(R, null);

    </div>
    <label class="campo"><span>Observações gerais</span><textarea name="observacoes" rows="4">${esc(R.observacoes||'')}</textarea></label>`,
    async f => {

      await alterar('matric_reunioes', R.id, {proxima_data:pd, proxima_local:val(f,'proxima_local'), observacoes:val(f,'observacoes')});
      let msg = 'Fechamento salvo.';
      if(pd && !D.agenda.some(g => g.tipo==='Reunião' && g.ubs_id===R.ubs_id && g.data===pd && g.situacao!=='Cancelada')){
        await inserir('matric_agenda', {tipo:'Reunião', ubs_id:R.ubs_id, data:pd, local:val(f,'proxima_local'), titulo:'Reunião de matriciamento'});
        msg = 'Fechamento salvo e próxima reunião agendada.';
      }
      await recarregar(msg);
    });
  document.querySelectorAll('[data-atual]').forEach(b => b.onclick = () => formAtualizacao(R, IX.ponto.get(b.dataset.atual)));
  document.querySelectorAll('[data-epto]').forEach(b => b.onclick = () => formPonto(R, IX.ponto.get(b.dataset.epto)));
  document.querySelectorAll('[data-eenc]').forEach(b => b.onclick = () => formEnc(R, D.enc.find(e=>e.id===b.dataset.eenc)));
  document.querySelectorAll('[data-conc]').forEach(b => b.onclick = async () => {
    const e = D.enc.find(x=>x.id===b.dataset.conc); b.disabled = true;
    try{ await alterar('matric_encaminhamentos', e.id, {concluido:!e.concluido}); await recarregar(e.concluido?'Encaminhamento reaberto.':'Encaminhamento concluído.'); }
    catch(er){ aviso(er.message, true); b.disabled = false; }
  });
}
function formAtualizacao(R, p){
  const a = atualDe(p.id, R.id), encs = encAnteriores(p, R.data);
  modal(`Atualizar ${p.codigo}`, `
    <div class="info"><b>${esc(p.descricao)}</b><br>${esc(p.endereco||'')}${p.quarteirao?' · Q. '+esc(p.quarteirao):''}
      <br><span class="mudo">Situação antes desta reunião: ${esc(situacaoAntes(p,R.data))}</span>
      ${encs.length?'<br><span class="mudo">Encaminhamento anterior: '+encs.map(e=>esc(e.acao)+(e.responsavel?' ('+esc(e.responsavel)+')':'')).join('; ')+'</span>':''}</div>
    <label class="campo"><span>O que foi feito *</span><textarea name="feito" rows="3" required>${esc(a?a.feito:'')}</textarea></label>
    <label class="campo"><span>Situação atual *</span><select name="situacao" required>${opts(SITUACOES, a?a.situacao:situacaoAntes(p,R.data))}</select>
      <small>Resolvido e Encerrado sem solução tiram o ponto das próximas atas.</small></label>
    ${encs.some(e=>!e.concluido)?`<label class="campo" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="concluir" style="width:auto"> Marcar os encaminhamentos anteriores como concluídos</label>`:''}
    ${a?'<button type="button" class="lnk" id="b-delatual" style="justify-self:start;color:var(--vencido)">Remover esta atualização</button>':''}`,
    async f => {
      await gravarOuAtualizar('matric_atualizacoes', {ponto_id:p.id, reuniao_id:R.id, feito:val(f,'feito'), situacao:f.situacao.value}, 'ponto_id,reuniao_id');
      if(f.concluir && f.concluir.checked){
        for(const e of encs.filter(e=>!e.concluido)) await alterar('matric_encaminhamentos', e.id, {concluido:true});
      }
      await recarregar('Ponto atualizado.');
    });
  const bd = $('#b-delatual');
  if(bd) bd.onclick = async () => {
    try{ await excluir('matric_atualizacoes', a.id); document.querySelector('.fundo').remove(); await recarregar('Atualização removida.'); }
    catch(e){ aviso(e.message, true); }
  };
}
function formPonto(R, p){
  const titulo = p ? `Editar ${p.codigo}` : 'Novo ponto';
  modal(titulo, `
    ${p?'':`<div class="info">O código será gerado ao salvar: <b class="mono">${esc(ubsSigla(R.ubs_id))}-${R.data.slice(0,4)}-…</b></div>`}
    <div class="grade3">
      <label class="campo"><span>Microárea</span><input type="text" name="microarea" value="${esc(p?p.microarea:'')}"></label>
      <label class="campo"><span>Quarteirão</span><input type="text" name="quarteirao" value="${esc(p?p.quarteirao:'')}"></label>
      <label class="campo"><span>Tipo de situação</span><select name="tipo">${opts(TIPOS, p?p.tipo:'', 'Selecione')}</select></label>
    </div>
    <label class="campo"><span>Endereço</span><input type="text" name="endereco" value="${esc(p?p.endereco:'')}" placeholder="Rua, número"></label>
    <label class="campo"><span>Descrição *</span><textarea name="descricao" rows="3" required>${esc(p?p.descricao:'')}</textarea>
      <small>Não registre nome de morador nem dado de saúde.</small></label>
    <label class="campo"><span>Levantado por</span><input type="text" name="levantado_por" value="${esc(p?p.levantado_por:'')}" placeholder="Ex.: ACS da microárea 02"></label>
    ${p?'<button type="button" class="lnk" id="b-delpto" style="justify-self:start;color:var(--vencido)">Excluir este ponto</button>':''}`,
    async f => {
      const linha = {microarea:val(f,'microarea'), quarteirao:val(f,'quarteirao'), tipo:val(f,'tipo'), endereco:val(f,'endereco'), descricao:val(f,'descricao'), levantado_por:val(f,'levantado_por')};
      if(p){ await alterar('matric_pontos', p.id, linha); await recarregar('Ponto atualizado.'); }
      else { const [n] = await inserir('matric_pontos', {...linha, ubs_id:R.ubs_id, reuniao_origem:R.id}); await recarregar('Ponto '+n.codigo+' criado.'); }
    }, {largura:680});
  const bd = $('#b-delpto');
  if(bd) bd.onclick = () => { document.querySelector('.fundo').remove();
    confirmar('Excluir ponto', `Excluir <b class="mono">${esc(p.codigo)}</b>? O histórico e os encaminhamentos dele também serão apagados. O código não será reaproveitado.`,
      async () => { await excluir('matric_pontos', p.id); await recarregar('Ponto excluído.'); }); };
}
function formEnc(R, e){
  const candidatos = parteA(R).concat(parteB(R));
  if(!candidatos.length) return aviso('Registre ou retome um ponto antes de criar encaminhamentos.', true);
  modal(e?'Editar encaminhamento':'Novo encaminhamento', `
    <label class="campo"><span>Ponto *</span><select name="ponto_id" required>${opts(candidatos.map(p=>({v:p.id,t:`${p.codigo} — ${p.descricao.slice(0,70)}`})), e?e.ponto_id:'', 'Selecione')}</select></label>
    <label class="campo"><span>Encaminhamento (ação) *</span><textarea name="acao" rows="3" required>${esc(e?e.acao:'')}</textarea></label>
    <div class="grade2">
      <label class="campo"><span>Responsável</span><input type="text" name="responsavel" value="${esc(e?e.responsavel:'')}" placeholder="Nome e função"></label>
      <label class="campo"><span>Prazo</span><input type="date" name="prazo" value="${esc(e?e.prazo||'':'')}"></label>
    </div>
    ${e?'<button type="button" class="lnk" id="b-delenc" style="justify-self:start;color:var(--vencido)">Excluir este encaminhamento</button>':''}`,
    async f => {
      const linha = {ponto_id:f.ponto_id.value, acao:val(f,'acao'), responsavel:val(f,'responsavel'), prazo:val(f,'prazo')};
      if(e) await alterar('matric_encaminhamentos', e.id, linha);
      else await inserir('matric_encaminhamentos', {...linha, reuniao_id:R.id});
      await recarregar(e?'Encaminhamento atualizado.':'Encaminhamento registrado.');
    });
  const bd = $('#b-delenc');
  if(bd) bd.onclick = async () => {
    try{ await excluir('matric_encaminhamentos', e.id); document.querySelector('.fundo').remove(); await recarregar('Encaminhamento excluído.'); }
    catch(er){ aviso(er.message, true); }
  };
}

/* ================= Pontos ================= */
function pontosFiltrados(){
  const b = F.pBusca.toLowerCase();
  return D.pontos.filter(p =>
    (!F.ubs || String(p.ubs_id)===String(F.ubs)) &&
    (F.pSit==='todos' || (F.pSit==='abertos' ? !FECHADAS.has(p.situacao) : p.situacao===F.pSit)) &&
    (!F.pTipo || p.tipo===F.pTipo) &&
    (!b || [p.codigo,p.endereco,p.quarteirao,p.descricao,p.microarea,p.levantado_por].some(x => String(x||'').toLowerCase().includes(b)))
  ).sort((a,b)=>(dataReun(a.reuniao_origem)||'').localeCompare(dataReun(b.reuniao_origem)||'') || a.codigo.localeCompare(b.codigo));
}

    <div class="bloco"><div class="corpo sem" id="lista-pontos"></div></div>`;
  const desenhar = () => {
    const lista = pontosFiltrados(), h = hoje();
    $('#lista-pontos').innerHTML = lista.length ? `<div class="tab-wrap"><table class="t">
      <thead><tr><th>Código</th><th>UBS</th><th>Micro</th><th>Endereço / Quarteirão</th><th>Tipo</th><th>Descrição</th><th>Situação</th><th>Desde</th><th class="num">Dias</th></tr></thead>
      <tbody>${lista.map(p => { const d0 = dataReun(p.reuniao_origem), fim = p.encerrado_em || h; return `<tr class="clica" data-id="${p.id}">
        <td class="cod">${esc(p.codigo)}</td><td>${esc(ubsSigla(p.ubs_id))}</td><td class="mono">${esc(p.microarea||'—')}</td>
        <td>${esc(p.endereco||'—')}${p.quarteirao?`<div class="sub mono">Q. ${esc(p.quarteirao)}</div>`:''}</td>
        <td>${esc(p.tipo||'—')}</td><td>${esc(p.descricao)}</td><td>${sit(p.situacao)}</td>

function exportarCSV(){
  const lista = pontosFiltrados(), h = hoje();
  const cab = ['Código','UBS','Microárea','Endereço','Quarteirão','Tipo','Descrição','Levantado por','Situação','Reunião de origem','Encerrado em','Dias','Último "o que foi feito"','Encaminhamentos pendentes'];
  const q = v => '"' + String(v??'').replace(/"/g,'""').replace(/\r?\n/g,' ') + '"';
  const linhas = lista.map(p => {
    const hist = (IX.atualPonto.get(p.id)||[]).slice().sort((a,b)=>(dataReun(b.reuniao_id)||'').localeCompare(dataReun(a.reuniao_id)||''));
    const pend = (IX.encPonto.get(p.id)||[]).filter(e=>!e.concluido).map(e=>e.acao+(e.prazo?' (até '+fmt(e.prazo)+')':'')).join(' | ');
    const d0 = dataReun(p.reuniao_origem);
    return [p.codigo, ubsSigla(p.ubs_id), p.microarea, p.endereco, p.quarteirao, p.tipo, p.descricao, p.levantado_por, p.situacao,
      fmt(d0), p.encerrado_em?fmt(p.encerrado_em):'', d0?dias(d0, p.encerrado_em||h):'', hist[0]?hist[0].feito:'', pend].map(q).join(';');
  });
  const blob = new Blob(['﻿' + [cab.map(q).join(';')].concat(linhas).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pontos_matriciamento_${h}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function eventos(){

    ev.push({data:r.data, cls:'ev-reuniao', titulo:`Reunião ${ubsSigla(r.ubs_id)}`, sub:'Ata registrada', hora:r.hora_inicio, href:'#/reuniao/'+r.id, ordem:1, k:'reuniao'});
  for(const g of D.agenda){
    if(!vistaUbs(g.ubs_id) || (g.situacao==='Realizada' && g.reuniao_id && IX.reun.get(g.reuniao_id))) continue;
    const reun = g.tipo==='Reunião';
    ev.push({data:g.data, cls:(reun?'ev-agendada':'ev-acao') + (g.situacao==='Cancelada'?' ev-cancelada':''), hora:g.hora,
      titulo: reun ? `Reunião ${ubsSigla(g.ubs_id)}` : (g.titulo || 'Ação') + (g.ubs_id?` · ${ubsSigla(g.ubs_id)}`:''),
      sub: [reun ? 'Reunião agendada' : 'Ação', g.situacao!=='Agendada'?g.situacao:'', g.local, g.responsaveis].filter(Boolean).join(' · '), agenda:g, ordem:0, k: reun ? 'reuniao' : 'acao'});
  }
  for(const e of D.enc){ const p = IX.ponto.get(e.ponto_id); if(!e.prazo || !p || !vistaUbs(p.ubs_id)) continue;
    ev.push({data:e.prazo, cls: e.concluido?'ev-feito':(e.prazo<h?'ev-vencido':'ev-prazo'), titulo:`Prazo: ${e.acao}`, sub:`${p.codigo} · ${e.responsavel||'sem responsável'}${e.concluido?' · concluído':e.prazo<h?' · vencido':''}`, href:'#/ponto/'+p.id, ordem:2, k:'prazo'}); }

  return ev.filter(e => F.gTipos[e.k]).sort((a,b)=>a.data.localeCompare(b.data) || a.ordem-b.ordem || String(a.hora||'').localeCompare(String(b.hora||'')));

  if(ba) ba.onclick = () => { fechar(); novaReuniao({ubs_id:g.ubs_id, data:g.data, local:g.local, hora:g.hora}); };

function exportarICS(){
  const h = hoje(), evs = eventos().filter(e => e.data>=h && !/ev-feito|ev-reuniao|ev-cancelada/.test(e.cls));
  if(!evs.length) return aviso('Não há compromissos futuros para exportar.', true);
  const limpa = t => String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g, m=>'\\'+m).replace(/\r?\n/g,'\\n');
  const carimbo = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const linhas = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Paulinia//Matriciamento ACS ACV//PT','CALSCALE:GREGORIAN'];
  evs.forEach((e,i) => {
    const d = e.data.replace(/-/g,''), hm = /^(\d{1,2}):(\d{2})$/.exec(String(e.hora||'').trim());
    linhas.push('BEGIN:VEVENT', `UID:matric-${d}-${i}-${Math.random().toString(36).slice(2,8)}@paulinia`, `DTSTAMP:${carimbo}`);
    if(hm){ const ini = `${d}T${hm[1].padStart(2,'0')}${hm[2]}00`; const fimH = String(Math.min(23, Number(hm[1])+2)).padStart(2,'0');
      linhas.push(`DTSTART;TZID=America/Sao_Paulo:${ini}`, `DTEND;TZID=America/Sao_Paulo:${d}T${fimH}${hm[2]}00`); }
    else { const n = new Date(e.data+'T12:00:00'); n.setDate(n.getDate()+1);
      linhas.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${n.toISOString().slice(0,10).replace(/-/g,'')}`); }
    linhas.push(`SUMMARY:${limpa(e.titulo)}`, `DESCRIPTION:${limpa(e.sub)}`);
    if(e.agenda && e.agenda.local) linhas.push(`LOCATION:${limpa(e.agenda.local)}`);
    linhas.push('END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  const blob = new Blob([linhas.join('\r\n')], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `agenda_matriciamento_${h}.ics`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    async f => {
      const sel = [...f.querySelectorAll('input[name=ubs]:checked')].map(x=>Number(x.value));
      if(f.funcao.value==='ACS' && sel.length!==1) throw new Error('Marque exatamente uma UBS para o ACS.');
      const linha = {nome:val(f,'nome'), funcao:f.funcao.value, ubs_id:f.funcao.value==='ACS'?sel[0]:null, ubs_ids:f.funcao.value==='ACS'?[]:sel, equipe:val(f,'equipe'), microarea:val(f,'microarea')};
      if(g){ linha.ativo = f.ativo.checked; await alterar('matric_agentes', g.id, linha); }
      else await inserir('matric_agentes', linha);
      await recarregar('Agente salvo.');
    }, {largura:680});
}
function colarAgentes(){
  const form = modal('Colar lista de agentes', `
    <div class="info">Uma pessoa por linha, separando com ponto e vírgula (ou colando colunas do Excel):<br>
      <span class="mono">Nome; Função; Sigla da UBS; Equipe; Microárea</span><br>
      Ex.: <span class="mono">Maria Souza; ACS; CENTRO; Azul; Azul 1</span> · <span class="mono">João Lima; ACV; BETEL, CENTRO</span><br>
      ACV e supervisão podem ter várias UBS, separadas por vírgula.</div>
    <label class="campo"><span>Lista</span><textarea name="lista" rows="10" required></textarea></label>
    <div id="prev-ag" class="mudo" style="font-size:13px"></div>`,
    async f => {
      const {ok, erros} = lerLista(f.lista.value);
      if(erros.length) throw new Error(erros.slice(0,5).join(' · '));
      if(!ok.length) throw new Error('Nenhuma linha válida.');
      await api('POST', 'matric_agentes', ok, 'return=minimal');
      await recarregar(ok.length+' agente(s) cadastrado(s).');
    }, {rotulo:'Cadastrar', largura:720});
  const lerLista = txt => {
    const ok = [], erros = [], sig = new Map(D.ubs.map(u=>[u.sigla.toUpperCase(), u.id]));
    const fun = new Map(FUNCOES.map(x=>[x.toUpperCase(), x]));
    txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i) => {
      const c = l.split(/\t|;/).map(x=>x.trim());
      if(/^nome$/i.test(c[0])) return;
      const funcao = fun.get((c[1]||'ACS').toUpperCase()) || null;
      const siglas = (c[2]||'').split(/[,\/]/).map(x=>x.trim().toUpperCase()).filter(Boolean);
      const ids = siglas.map(x=>sig.get(x)), falta = siglas.filter((x,k)=>!ids[k]);
      if(!c[0]) erros.push(`linha ${i+1}: falta o nome`);
      else if(!funcao) erros.push(`linha ${i+1}: função "${c[1]}" não reconhecida`);
      else if(falta.length) erros.push(`linha ${i+1}: UBS "${falta.join(', ')}" não cadastrada`);
      else if(funcao==='ACS' && ids.length!==1) erros.push(`linha ${i+1}: ACS precisa de uma UBS`);
      else ok.push({nome:c[0], funcao, ubs_id:funcao==='ACS'?ids[0]:null, ubs_ids:funcao==='ACS'?[]:ids, equipe:c[3]||null, microarea:c[4]||null});
    });
    return {ok, erros};
  };
  form.lista.oninput = () => { const {ok, erros} = lerLista(form.lista.value);
    form.querySelector('#prev-ag').innerHTML = `${ok.length} linha(s) prontas${erros.length?` · <span class="venc">${erros.length} com problema: ${esc(erros.slice(0,3).join(' · '))}</span>`:''}`; };
}
function formAcesso(a){
  modal(a?'Editar acesso':'Incluir pessoa', `
    <label class="campo"><span>E-mail *</span><input type="email" name="email" required value="${esc(a?a.email:'')}" ${a?'disabled':''}></label>
    <div class="grade2">
      <label class="campo"><span>Nome</span><input type="text" name="nome" value="${esc(a?a.nome:'')}"></label>
      <label class="campo"><span>Função</span><select name="funcao">${opts(FUNCOES, a?a.funcao:'', 'Selecione')}</select></label>
    </div>
    <label class="campo" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="edita" ${a&&a.edita?'checked':''} style="width:auto"> Edição: registra e edita reuniões e vê todas as UBS</label>
    <div class="campo" id="campo-ubs"><span>UBS que pode ver (consulta) *</span>
      <div class="chips">${D.ubs.map(u => `<label class="chip"><input type="checkbox" name="ubs" value="${u.id}" ${a&&(a.ubs_ids||[]).includes(u.id)?'checked':''}><span>${esc(u.nome)}<small>${esc(u.sigla)}</small></span></label>`).join('')}</div></div>
    ${a?'<button type="button" class="lnk" id="b-delac" style="justify-self:start;color:var(--vencido)">Remover acesso</button>':''}`,
    async f => {
      const sel = [...f.querySelectorAll('input[name=ubs]:checked')].map(x=>Number(x.value));
      if(!f.edita.checked && !sel.length) throw new Error('Marque ao menos uma UBS para o acesso de consulta.');
      const linha = {nome:val(f,'nome'), funcao:val(f,'funcao'), edita:f.edita.checked, ubs_ids:f.edita.checked?[]:sel};
      if(a) await alterar('matric_acesso', a.email, linha, 'email');
      else {
        const email = String(f.email.value).trim().toLowerCase();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('E-mail inválido.');
        await inserir('matric_acesso', {...linha, email});
      }
      await recarregar('Acesso salvo.');
    });
  const fm = document.querySelector('.fundo form'), cu = fm.querySelector('#campo-ubs');
  const mostrar = () => cu.style.display = fm.edita.checked ? 'none' : '';
  fm.edita.onchange = mostrar; mostrar();
  const bd = $('#b-delac');
  if(bd) bd.onclick = async () => {
    try{ await excluir('matric_acesso', a.email, 'email'); document.querySelector('.fundo').remove(); await recarregar('Acesso removido.'); }
    catch(e){ aviso(e.message, true); }
  };
}
function colarAcessos(){
  const form = modal('Colar lista de acessos', `
    <div class="info">Uma pessoa por linha, separando com ponto e vírgula (ou colando colunas do Excel):<br>
      <span class="mono">E-mail; Nome; Função; Siglas das UBS; Edita (S/N)</span><br>
      Ex.: <span class="mono">ubscentro@gmail.com; UBS Centro; Enfermeiro(a) da UBS; CENTRO</span><br>
      <span class="mono">fulano@gmail.com; Fulano; ACV; ; S</span> (edição vê todas as UBS)</div>
    <label class="campo"><span>Lista</span><textarea name="lista" rows="10" required></textarea></label>
    <div id="prev-ac" class="mudo" style="font-size:13px"></div>`,
    async f => {
      const {ok, erros} = ler(f.lista.value);
      if(erros.length) throw new Error(erros.slice(0,5).join(' · '));
      if(!ok.length) throw new Error('Nenhuma linha válida.');
      await api('POST', 'matric_acesso?on_conflict=email', ok, 'resolution=merge-duplicates,return=minimal');
      await recarregar(ok.length+' acesso(s) salvo(s).');
    }, {rotulo:'Salvar acessos', largura:760});
  const ler = txt => {
    const ok = [], erros = [], sig = new Map(D.ubs.map(u=>[u.sigla.toUpperCase(), u.id])), fun = new Map(FUNCOES.map(x=>[x.toUpperCase(), x]));
    txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i) => {
      const c = l.split(/\t|;/).map(x=>x.trim());
      if(/^e-?mail$/i.test(c[0])) return;
      const email = (c[0]||'').toLowerCase(), edita = /^(s|sim|x|1)$/i.test(c[4]||'');
      const siglas = (c[3]||'').split(/[,\/]/).map(x=>x.trim().toUpperCase()).filter(Boolean), ids = siglas.map(x=>sig.get(x)), falta = siglas.filter((x,k)=>!ids[k]);
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) erros.push(`linha ${i+1}: e-mail inválido`);
      else if(falta.length) erros.push(`linha ${i+1}: UBS "${falta.join(', ')}" não cadastrada`);
      else if(!edita && !ids.length) erros.push(`linha ${i+1}: consulta precisa de ao menos uma UBS`);
      else ok.push({email, nome:c[1]||null, funcao:fun.get((c[2]||'').toUpperCase())||c[2]||null, edita, ubs_ids:edita?[]:ids});
    });
    return {ok, erros};
  };
  form.lista.oninput = () => { const {ok, erros} = ler(form.lista.value);
    form.querySelector('#prev-ac').innerHTML = `${ok.length} linha(s) prontas${erros.length?` · <span class="venc">${erros.length} com problema: ${esc(erros.slice(0,3).join(' · '))}</span>`:''}`; };
}
